site_name: MarkitDoc
site_description: Markdown to professional PDF, PowerPoint and Word documents.
site_url: https://nishikantmandal007.github.io/markitdoc
repo_url: https://github.com/nishikantmandal007/markitdoc
repo_name: markitdoc

theme:
  name: material
  logo: assets/mark-white.svg
  favicon: assets/mark.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight

nav:
  - Home: index.md
  - Getting started: getting-started.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
