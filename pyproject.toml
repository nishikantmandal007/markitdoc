[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "markitdoc"
version = "0.1.0"
description = "Markdown to professional PDF, PowerPoint and Word documents: deterministic, offline-first, built for AI-written content."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fpdf2==2.8.9",
    "markdown-it-py==4.2.0",
    "mdit-py-plugins==0.7.0",
    "python-pptx==1.0.2",
    "python-docx==1.2.0",
    "pillow>=12.3.0",
    "numpy>=1.24.4",
    "matplotlib>=3.7.2",
    "pymupdf>=1.25.5",
    "pyyaml>=6.0.3",
    "lxml>=6.1.3",
    "requests>=2.34.2",
    "pyphen==0.18.1",
    "ziamath==0.13",
    "ziafont==0.11",
    "latex2mathml==3.81.1",
    "uharfbuzz==0.56.4",
]

# tests and docs live only in a clone of the repository: `uv sync` there installs these groups; `pip install markitdoc`
# installs the library and its dependencies alone.
[project.scripts]
markitdoc = "markitdoc.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1"]
docs = ["mkdocs==1.6.1", "mkdocs-material==9.7.7"]

[tool.uv]
default-groups = ["dev", "docs"]

[tool.setuptools.packages.find]
where = ["."]
include = ["markitdoc*"]

[tool.setuptools.package-data]
markitdoc = ["assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["F", "I"]
per-file-ignores = {"__init__.py" = ["F401"]}
